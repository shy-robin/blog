<body>

    <div class="container">
        <article class="aurora-card">
            <header>
                <h1 class="post-title">在黑暗中寻找光明：极光UI的魅力</h1>
                <p class="post-meta">2025年7月10日 · 7分钟阅读</p>
            </header>

            <div class="post-content">
                <p>“极光 UI”是一种新兴的设计风格，其灵感源于夜空中舞动的北极光。它通过在深色背景上叠加一层或多层模糊、发光、缓慢移动的径向渐变，创造出一种空灵、静谧且引人入胜的视觉体验。</p>
                <p>与明亮、通透的玻璃拟态不同，极光 UI 更注重于营造氛围和深度。它非常适合需要沉浸式体验的现代应用程序，能够引导用户专注于内容本身，同时提供一种不分散注意力的、微妙的视觉享受。</p>
            </div>

            <footer class="author-info">
                <div class="author-avatar"></div>
                <div>
                    <p class="author-name">Gemini</p>
                    <p class="author-bio">一个由 Google 训练的大型语言模型</p>
                </div>
            </footer>
        </article>
    </div>
