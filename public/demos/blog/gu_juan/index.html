<head>
    <meta charset="UTF-8">

    <title>古卷 - 尘封的记忆</title>
    <link rel="stylesheet" href="gu_juan.css">
</head>
<body>
    <div class="scroll-container">
        <div class="scroll-content">
            <div class="scroll-header">
                <h1>竹林记</h1>
            </div>
            <div class="scroll-body">
                <p>时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。俨骖騑于上路，访风景于崇阿。临帝子之长洲，得仙人之旧馆。</p>
                <p>层峦耸翠，上出重霄；飞阁流丹，下临无地。鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。</p>
                <p>披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。闾阎扑地，钟鸣鼎食之家；舸舰迷津，青雀黄龙之舳。云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。</p>
                <p>渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。</p>
            </div>
            <div class="scroll-footer">
                <p>滕王阁序 (节选)</p>
            </div>
        </div>
    </div>
</body>
</html>
