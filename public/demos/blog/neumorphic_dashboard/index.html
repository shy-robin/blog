<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Dashboard</title>
    <link rel="stylesheet" href="neumorphic_dashboard.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo">D</div>
            <nav class="menu">
                <a href="#" class="menu-item active"><i class="material-icons">home</i><span>Home</span></a>
                <a href="#" class="menu-item"><i class="material-icons">analytics</i><span>Analytics</span></a>
                <a href="#" class="menu-item"><i class="material-icons">mail</i><span>Messages</span></a>
                <a href="#" class="menu-item"><i class="material-icons">settings</i><span>Settings</span></a>
            </nav>
            <div class="profile">
                <div class="profile-pic"></div>
                <span>Username</span>
            </div>
        </aside>
        <main class="main-content">
            <header class="header">
                <h2>Dashboard</h2>
                <div class="search-bar">
                    <i class="material-icons">search</i>
                    <input type="text" placeholder="Search...">
                </div>
            </header>
            <div class="card-grid">
                <div class="card large">
                    <h3>Welcome Back!</h3>
                    <p>Here's a summary of your activity.</p>
                </div>
                <div class="card medium">
                    <h3>New Followers</h3>
                    <p class="stat">1,234</p>
                </div>
                <div class="card medium">
                    <h3>Engagement</h3>
                    <p class="stat">87%</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
