<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水墨山水 - 博客</title>
    <link rel="stylesheet" href="shui_mo_hua.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>墨韵</h1>
        </header>
        <main>
            <article>
                <div class="title-seal">
                    <h2>静夜思</h2>
                    <div class="seal">静</div>
                </div>
                <p class="meta">作于 丙辰年 夏</p>
                <p>床前明月光，疑是地上霜。举头望明月，低头思故乡。文字在水墨的意境中，仿佛也染上了一层淡淡的乡愁。每一笔，每一划，都承载着千年的文化与情感。</p>
                <div class="ink-wash-image">
                    <p>远山 / 近水</p>
                </div>
                <p>设计此页，意在探索数字世界中的留白与禅意。简，而非减。在繁杂的信息流中，寻一处心灵的栖息地，如同一幅淡淡的水墨画，意蕴悠长。</p>
            </article>
        </main>
        <footer>
            <p>观止 | 2025</p>
        </footer>
    </div>
</body>
</html>
